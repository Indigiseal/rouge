<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Card Crawler</title>
    <!-- Phaser as a plain UMD script. Previously this file used an
         esm.sh-wrapped Phaser ESM build whose source had
         `import __Process$ from "/node/process.mjs"` — a host-root
         import that 403s on itch.io's CDN, leaving Phaser undefined
         and the game stuck on a black screen. The standalone UMD
         build below is self-contained and sets window.Phaser. -->
    <script src="vendor/phaser-3.70.0.min.js"></script>
    <style>
        @font-face {
            font-family: "HoMM Pixel";
            src: url("assets/fonts/Able5.ttf") format("truetype");
            font-display: block;
        }

        /* Options-screen serif. EB Garamond (SIL Open Font License — see
           assets/fonts/EB_Garamond/OFL.txt), subset to the Latin and Cyrillic
           the game can display: 33 KB instead of the 6 MB the full download is.
           Rebuild with tools/subset-font.py.

           To try SemiBold instead, swap "Medium" for "SemiBold" on both lines
           below — the subset script builds them both, and only the weight named
           here is ever downloaded. */
        @font-face {
            font-family: "Garamond UI";
            src: url("assets/fonts/EBGaramond-Medium-subset.woff2") format("woff2"),
                 url("assets/fonts/EBGaramond-Medium-subset.ttf") format("truetype");
            font-display: block;
        }

        body {
            margin: 0;
            padding: 0;
            /* Matches the Phaser canvas colour so handing over to the game's
               own loading bar is not a visible flash of a different screen. */
            background: #2c1810;
            font-family: "HoMM Pixel", Arial, Helvetica, sans-serif;
            overflow: hidden;
        }
        #phaser-game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Covers the stretch before Phaser exists: ~1.2MB of engine, the module
           graph, and main.js's font wait. Phaser cannot draw during any of it,
           so without this the player stares at an empty brown page and cannot
           tell a slow download from a hang. */
        /* This is the ONLY loading screen. PreloadScene used to draw a second
           one inside the canvas and hand over to it, which visibly jumped:
           the canvas runs at zoom 2 so its bar was twice the size, and canvas
           text upscaled 2x is blurry next to browser-rendered text. PreloadScene
           now just drives the elements below (see createLoadingUI) and removes
           this overlay when the assets are in. Do not re-add a canvas loader. */
        #boot-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #2c1810;
            color: #e6edf3;
            z-index: 10;
        }
        #boot-loader .boot-title {
            font-size: 36px;
            letter-spacing: 1px;
        }
        #boot-loader .boot-track {
            position: relative;
            width: 528px;
            height: 32px;
            border: 2px solid #8b6914;
            background: rgba(0, 0, 0, 0.45);
            overflow: hidden;
            box-sizing: border-box;
        }
        /* Indeterminate until Phaser can report real progress: nothing before
           that knows the download size, and a fake percentage that jumps to
           100% and waits is worse than an honest "something is happening". */
        #boot-loader .boot-track::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            background: #d4a017;
            animation: boot-sweep 1.1s ease-in-out infinite;
        }
        /* Swapped in by PreloadScene once the loader starts reporting. */
        #boot-loader .boot-track.is-determinate::after { display: none; }
        #boot-loader .boot-fill {
            display: none;
            width: 0;
            height: 100%;
            background: #d4a017;
        }
        #boot-loader .boot-track.is-determinate .boot-fill { display: block; }
        #boot-loader .boot-status {
            font-size: 20px;
            color: #8b949e;
            /* Breathing, so a percentage stuck on one slow file still reads as
               alive rather than frozen. */
            animation: boot-pulse 1.3s ease-in-out infinite;
        }
        #boot-loader .boot-errors {
            font-size: 16px;
            color: #d98c8c;
            min-height: 18px;
        }
        @keyframes boot-sweep {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
        @keyframes boot-pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.35; }
        }
        @media (prefers-reduced-motion: reduce) {
            #boot-loader .boot-track::after { animation-duration: 3s; }
            #boot-loader .boot-status { animation: none; }
        }
    </style>
</head>
<body>
    <div id="boot-loader">
        <div class="boot-title">Dungeon Card Crawler</div>
        <div class="boot-track"><div class="boot-fill"></div></div>
        <div class="boot-status">Starting up...</div>
        <div class="boot-errors"></div>
    </div>
    <div id="phaser-game-container"></div>
    <script>
        // If the engine or the module graph never arrives, main.js never runs
        // and nothing below ever updates this screen. Say something after a
        // while rather than sweeping a bar forever with no explanation.
        // Only speak up while we still have nothing to report. Once PreloadScene
        // starts feeding real percentages the bar is determinate, and stamping
        // "still loading" over a live 47% would just look broken.
        function bootStillWaiting() {
            var track = document.querySelector('#boot-loader .boot-track');
            return track && !track.classList.contains('is-determinate');
        }
        setTimeout(function () {
            var status = document.querySelector('#boot-loader .boot-status');
            if (status && bootStillWaiting()) status.textContent = 'Still loading - large download, please wait...';
        }, 8000);
        setTimeout(function () {
            var status = document.querySelector('#boot-loader .boot-status');
            if (status && bootStillWaiting()) status.textContent = 'Still loading - try refreshing if this does not finish.';
        }, 30000);
    </script>
    <script type="module" src="src/main.js?v=20260728-loading"></script>
</body>
</html>
